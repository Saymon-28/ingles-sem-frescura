<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inglês Sem Frescura</title>
<meta name="description" content="Aprenda inglês do zero conversando com uma professora que não tem paciência pra você.">
<meta name="theme-color" content="#f6f3ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f6f3ee;--card:#fff;--card2:#ece7df;--line:#e1dacf;
  --txt:#1d1a17;--mut:#6b635a;--acc:#d9441f;--acc2:#9a5b00;
  --ok:#1b8a4b;--okt:#fff;--bad:#d1334a;--okbg:#e3f5ea;--badbg:#fde8eb;
  --ub:#fbe9e2;--ubl:#f0c9ba;--fb:#e6eefb;--fbl:#c5d6f2;
  --hero:linear-gradient(135deg,#ffe9df,#fff);--tab:#fffdfa;--r:16px;
}
:root[data-theme="dark"]{
  --bg:#14110f;--card:#1f1a17;--card2:#2a231f;--line:#3a312b;
  --txt:#f5ede6;--mut:#a89b90;--acc:#ff5a36;--acc2:#ffb020;
  --ok:#3ecf72;--okt:#06210f;--bad:#ff4d5e;--okbg:#12301f;--badbg:#34141a;
  --ub:#3a2218;--ubl:#5a3322;--fb:#1a2430;--fbl:#2a3a4c;
  --hero:linear-gradient(135deg,#3a1a10,#1f1a17);--tab:#1a1512;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:680px;margin:0 auto;min-height:100vh}
.wrap{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.wrap.nt{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0}
h2{font-size:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px}
.logo b{color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.hero{background:var(--hero);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.hero p{margin:6px 0 0;color:var(--mut)}
.hero .quote{color:var(--txt);font-style:italic}
.herorow{display:flex;gap:12px;align-items:center}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--tab);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs>div{display:flex;width:100%;max-width:680px}
.tabs button{flex:1;padding:9px 2px 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
.tabs button i{font-style:normal;font-size:21px}
.tabs button.on{color:var(--acc)}
.sec{margin:18px 0 8px;color:var(--mut);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.list{display:grid;gap:10px}
.unit{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.unit:active{transform:scale(.99)}
.unit .em{font-size:28px;width:50px;height:50px;display:grid;place-items:center;background:var(--card2);border-radius:14px;flex:none}
.unit h3{font-size:17px}
.unit small{color:var(--mut)}
.bar{height:6px;border-radius:9px;background:var(--card2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .3s}
.done .bar i,.bar.g i{background:var(--ok)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:16px;background:var(--acc);color:#fff;text-align:center}
.btn.sec2{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.btn.ok{background:var(--ok);color:var(--okt)}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;display:inline-block}
.row{display:flex;gap:10px}
.row>*{flex:1}
.back{color:var(--mut);font-weight:700;padding:6px 0}
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.q-top .bar{flex:1;height:10px;margin:0}
.x{font-size:22px;color:var(--mut);padding:4px 8px}
.prompt{color:var(--mut);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.word{font-size:30px;font-weight:900;margin:0 0 4px}
.pron{color:var(--acc2);font-weight:600}
.speak,.sp{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:18px;vertical-align:middle;margin-left:6px}
.opts{display:grid;gap:10px;margin:20px 0}
.opt{padding:15px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:700;text-align:left;font-size:17px;color:var(--txt)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opts.locked .opt{pointer-events:none}
input.type,input.tx{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--txt);font-size:18px;outline:none}
input.type{margin:20px 0;font-size:20px}
input.type:focus,input.tx:focus{border-color:var(--acc)}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border-top:2px solid;animation:up .2s ease-out;z-index:20}
.sheet>div{max-width:680px;margin:0 auto}
.sheet.ok{background:var(--okbg);border-color:var(--ok)}
.sheet.bad{background:var(--badbg);border-color:var(--bad)}
.sheet h3{font-size:18px;margin-bottom:4px}
.sheet p{margin:0 0 12px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.card .face{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;gap:6px;width:100%;margin:10px 0 16px;color:var(--txt)}
.card .big{font-size:34px;font-weight:900}
.hint{color:var(--mut);font-size:13px;margin-top:10px}
.res{text-align:center;padding-top:30px}
.res .big{font-size:64px}
.res .stats{display:flex;justify-content:center;gap:10px;margin:18px 0;flex-wrap:wrap}
.set{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.set small{color:var(--mut);display:block}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
.install{background:var(--card2);border:1px dashed var(--acc);border-radius:var(--r);padding:12px;margin-bottom:16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.mut{color:var(--mut)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mood{display:grid;gap:10px;margin:14px 0}
.mood button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;width:100%}
.mood button.on{border-color:var(--acc);background:var(--ub)}
.mood small{color:var(--mut);display:block}
.chatlog{display:grid;gap:10px;padding-bottom:12px}
.chatlog>*{scroll-margin-bottom:240px}
.b{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.4;word-wrap:break-word}
.b.t{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;justify-self:start}
.b.u{background:var(--ub);border:1px solid var(--ubl);border-bottom-right-radius:4px;justify-self:end}
.b.f{background:var(--fb);border:1px solid var(--fbl);justify-self:start}
.b.err{background:var(--badbg);border:1px solid var(--bad);justify-self:start}
.b .tr{color:var(--mut);font-size:14px;margin-top:4px}
.b .tr.hid{filter:blur(5px);cursor:pointer}
.b .cor{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--acc2);font-size:14px}
.w{display:inline-block;margin:1px 3px 1px 0;padding:1px 6px;border-radius:7px;font-weight:700}
.w.ok{background:var(--okbg);color:var(--ok)}
.w.no{background:var(--badbg);color:var(--bad);text-decoration:underline}
.dock{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;border-top:1px solid var(--line)}
.cue{background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:15px}
.mic{width:100%;padding:16px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;font-size:17px;margin-bottom:8px}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.send{display:flex;gap:8px;margin-bottom:8px}
.send .tx{flex:1}
.send button{padding:0 18px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:800}
.chipset{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chipset button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
.chipset button.on{border-color:var(--acc);color:var(--acc)}
.mission{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mission:last-child{border:0}
.mission .bar{flex:1;margin:0}
.mission.d{color:var(--ok)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pair .col{display:grid;gap:8px;align-content:start}
.pair button{padding:12px 8px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:15px;color:var(--txt)}
.pair button.sel{border-color:var(--acc)}
.pair button.gone{opacity:.25;pointer-events:none;border-color:var(--ok)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:30}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:420px;width:100%}
.modal p{color:var(--mut)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 16px;border-radius:99px;font-weight:800;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.card2{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card2 ol{margin:8px 0 0;padding-left:20px;color:var(--mut)}
/* cadastro, mascote e treino de voz */
.ob{padding-bottom:96px}
.obt{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.obt .bar{flex:1;height:8px;margin:0}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{width:38px;height:38px;border-radius:12px;font-size:18px}
.tg{display:flex;background:var(--card2);border-radius:99px;padding:3px}
.ctl .tg{width:auto;height:auto;font-size:14px}
.tg span{padding:5px 9px;border-radius:99px;font-size:14px;line-height:1}
.tg span.on{background:var(--acc);filter:none}
.ask{display:flex;gap:10px;align-items:flex-start;margin:6px 0 22px}
.mas{flex:none;animation:flt 3.2s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-5px)}}
.bub{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:19px;line-height:1.35;flex:1;margin-top:8px}
.bub:before{content:"";position:absolute;left:-7px;top:22px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.ol{display:grid;gap:10px}
.o2{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;color:var(--txt)}
.o2.on{border-color:var(--acc);background:var(--ub)}
.oi{font-size:22px;width:30px;text-align:center;flex:none}
.ot{flex:1;font-size:17px}
.ot small{display:block;color:var(--mut);font-weight:400;font-size:14px}
.ck{opacity:0;color:var(--acc);font-weight:900}
.o2.on .ck{opacity:1}
.obf{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.obf>*{max-width:648px;margin:0 auto}
.term{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0}
.term button{display:grid;gap:4px;justify-items:center;padding:10px 2px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--mut)}
.term button i{font-style:normal;font-size:24px}
.term button.on{border-color:var(--acc);color:var(--txt);background:var(--ub)}
.bigterm{font-size:44px;font-weight:900;text-align:center;margin:20px 0 4px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--mut);margin-top:12px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin:14px 0}
.chart svg{width:100%;height:auto;display:block}
.stage{display:grid;place-items:center;padding:6px 0}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;text-align:center;margin:6px 0 4px}
.pcard .lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.pcard h2{font-size:28px;line-height:1.2}
.micr{display:grid;place-items:center;gap:8px;margin:10px 0}
.micb{width:84px;height:84px;border-radius:50%;background:var(--card2);border:3px solid var(--mut);font-size:34px;display:grid;place-items:center}
.micb.on{background:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
.micr small{color:var(--mut);text-align:center}
.lnk{color:var(--mut);text-decoration:underline;padding:6px}
.fbk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0;text-align:center}
@media (prefers-reduced-motion:reduce){.mas{animation:none}.shake,.mic.on,.micb.on{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ============================================================

const UNITS = [

/* ============================================================
   DADOS: situações (conversas roteirizadas)
   ============================================================ */
const SITS = [
 {th:'Viagem',ic:'✈️',list:[
  {id:'aeroporto',t:'No aeroporto',turns:[
   {en:'Good morning! Passport, please.',pt:'Bom dia! Passaporte, por favor.',cue:'Entregue o passaporte: “Aqui está.”',a:['Here you are','Here it is','Here is my passport']},

   {en:'Do you have any bags to check in?',pt:'Você tem malas para despachar?',cue:'Diga: “Sim, eu tenho uma mala.”',a:['Yes I have one bag','Yes I have one suitcase','Yes one bag']},

  {id:'hotel',t:'No hotel',turns:[
   {en:'Welcome to the hotel! Do you have a reservation?',pt:'Bem-vindo ao hotel! Você tem reserva?',cue:'Diga: “Sim, eu tenho uma reserva.”',a:['Yes I have a reservation','Yes I do','I have a reservation']},
   {en:'How many nights are you staying?',pt:'Quantas noites você vai ficar?',cue:'Diga: “Três noites.”',a:['Three nights','I am staying three nights','I am staying for three nights']},
   {en:'Would you like breakfast?',pt:'Você gostaria de café da manhã?',cue:'Diga: “Sim, por favor.”',a:['Yes please','Yes I would like breakfast','Yes please I would like breakfast']},
   {en:'Here is your key. Room two oh five.',pt:'Aqui está sua chave. Quarto 205.',cue:'Pergunte: “Onde fica o elevador?”',a:['Where is the elevator','Where is the lift']}]}]},
 {th:'Comida',ic:'🍽️',list:[
  {id:'restaurante',t:'No restaurante',turns:[

let enVoice=null;

  if(!('speechSynthesis' in window))return;
  const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
  enVoice=v.find(x=>/en[-_]US/i.test(x.lang)&&/samantha|zira|jenny|aria|google us|female/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null;
}

function speak(t,rate,force){
  if(!S.voice||!('speechSynthesis' in window))return;
  if(!force&&S.voiceMode==='drill'&&!['pron','dlg','chat'].includes(view))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(t).replace('...',''));
  u.lang='en-US';u.rate=rate||.9;if(enVoice)u.voice=enVoice;
  speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function stopListen(){try{rec&&rec.abort()}catch(e){}rec=null}
function listen(onres,onend){
  if(!SR){toast('Seu navegador não ouve voz. Use o Chrome ou o Edge, ou digite.');return false}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  stopListen();
  rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=3;rec.continuous=false;
  let got=false;
  rec.onresult=e=>{got=true;onres([...e.results[0]].map(x=>x.transcript))};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast('Libere o microfone nas permissões do navegador.');else if(e.error==='no-speech')toast('Não ouvi nada. Tente de novo.')};
  rec.onend=()=>onend&&onend(got);
  try{rec.start()}catch(e){return false}
  return true;
}

  };
}

const CONTR={"i'm":'i am',"you're":'you are',"he's":'he is',"she's":'she is',"it's":'it is',"we're":'we are',"they're":'they are',"don't":'do not',"doesn't":'does not',"didn't":'did not',"can't":'cannot',"won't":'will not',"i'd":'i would',"i'll":'i will',"i've":'i have',"what's":'what is',"that's":'that is',"there's":'there is',"let's":'let us',"isn't":'is not',"aren't":'are not',"wasn't":'was not',"haven't":'have not',"couldn't":'could not',"wouldn't":'would not',"where's":'where is',"how's":'how is',"dont":'do not',"im":'i am'};
function tk(s){return s.toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean).map(w=>({w:w.replace(/'/g,"'"),p:(CONTR[w]||w).split(' ')}))}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const eq=(a,b)=>a===b||(a.length>=5&&b.length>=5&&lev(a,b)<=1);
function compare(target,said){
  const T=tk(target),U=tk(said);
  const tp=T.flatMap((t,i)=>t.p.map(p=>({p,i}))),up=U.flatMap(u=>u.p);
  const n=tp.length,m=up.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=eq(tp[i-1].p,up[j-1])?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const got=new Array(T.length).fill(0),need=T.map(t=>t.p.length);
  let i=n,j=m;
  while(i>0&&j>0){
    if(eq(tp[i-1].p,up[j-1])&&dp[i][j]===dp[i-1][j-1]+1){got[tp[i-1].i]++;i--;j--}
    else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;
  }
  const lcs=dp[n][m],extra=Math.max(0,m-lcs);
  const score=n?Math.max(0,lcs/n-Math.min(.2,extra*.05)):0;
  return {score,words:T.map((t,k)=>({w:t.w,ok:got[k]===need[k]}))};
}
function evalAns(alts,answers){
  let best=null;
  alts.forEach(s=>answers.forEach(a=>{const r=compare(a,s);r.target=a;r.said=s;if(!best||r.score>best.score)best=r}));
  return best;
}

    :`${eye(40)}${eye(70)}<path d="M45 52q10 10 20 0" fill="none" stroke="${c[1]}" stroke-width="4" stroke-linecap="round"/>`;

}

    };

    draw();$('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;k=+b.dataset.j;draw()};
  }else if(i===5){

    bindOpts(false,st);
  }else if(i===6){

    bindOpts(false,st);

let Q=null;
function startQuiz(u,opt={}){
  const pool=u.items?u.items.map(i=>wordOf(u,i)):allWords();
  const weighted=[];
  pool.forEach(w=>{const s=S.words[w.en]||{ok:0,bad:0};const n=1+Math.max(0,s.bad-s.ok);for(let k=0;k<Math.min(n,4);k++)weighted.push(w)});
  const chosen=[];
  shuffle(weighted).forEach(w=>{if(!chosen.includes(w)&&chosen.length<(opt.n||10))chosen.push(w)});
  const types=['en2pt','pt2en','listen','type'];
  const qs=chosen.map((w,i)=>({w,type:types[i%types.length]}));
  Q={u,queue:shuffle(qs),total:qs.length,done:0,hits:0,miss:0,xp:0,pool,opt};
  nextQ();
}
function nextQ(){
  if(!Q.queue.length)return finishQuiz();
  const q=Q.queue[0],w=q.w;view='quiz';
  const top=`<div class="q-top"><button class="x" id="x">✕</button><div class="bar"><i style="width:${Q.done/Q.total*100}%"></i></div></div>`;
  const others=key=>{
    let c=[...new Set(Q.pool.filter(x=>x.en!==w.en).map(x=>x[key]))];
    if(c.length<3)c=c.concat([...new Set(allWords().filter(x=>x.en!==w.en).map(x=>x[key]))]);
    return shuffle(c).filter(x=>x!==w[key]).slice(0,3);
  };
  const choose=(promptTxt,mainHtml,correct,list)=>{
    full(top+`<div class="prompt">${promptTxt}</div>${mainHtml}<div class="opts" id="opts">${list.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`);
    $('#opts').onclick=e=>{
      const b=e.target.closest('.opt');if(!b)return;
      const ok=b.dataset.v===correct;
      $('#opts').classList.add('locked');b.classList.add(ok?'right':'wrong');
      if(!ok)[...document.querySelectorAll('.opt')].find(x=>x.dataset.v===correct).classList.add('right');
      answerQ(ok,correct);
    };
  };
  if(q.type==='en2pt'){
    choose('O que significa?',`<h2 class="word">${esc(w.en)}<button class="speak" id="sp">🔊</button></h2><div class="pron">${esc(w.pron)}</div>`,w.pt,shuffle([w.pt,...others('pt')]));
    $('#sp').onclick=()=>speak(w.en,0,1);speak(w.en);
  }else if(q.type==='pt2en'){
    choose('Como se diz em inglês?',`<h2 class="word">${esc(w.pt)}</h2>`,w.en,shuffle([w.en,...others('en')]));
  }else if(q.type==='listen'){
    choose('Ouça e escolha o que você ouviu',`<button class="btn sec2" id="sp" style="max-width:220px">🔊 Ouvir de novo</button>`,w.en,shuffle([w.en,...others('en')]));
    $('#sp').onclick=()=>speak(w.en,0,1);speak(w.en);
  }else{
    full(top+`<div class="prompt">Escreva em inglês</div><h2 class="word">${esc(w.pt)}</h2>
      <input class="type" id="inp" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="digite aqui…"><button class="btn" id="go">Verificar</button>`);
    const go=()=>{const v=$('#inp').value;if(!v.trim())return;$('#inp').disabled=true;$('#go').style.display='none';answerQ(norm(v)===norm(w.en),w.en)};
    $('#go').onclick=go;$('#inp').onkeydown=e=>{if(e.key==='Enter')go()};
    setTimeout(()=>$('#inp')&&$('#inp').focus(),50);
  }
  $('#x').onclick=()=>{if(confirm('Desistindo?')){Q=null;go(view==='quiz'?'hoje':'hoje')}};
}
function answerQ(ok,correct){
  const q=Q.queue.shift(),w=q.w;
  const st=S.words[w.en]||(S.words[w.en]={ok:0,bad:0});
  const m=M();
  if(ok){st.ok++;Q.hits++;Q.done++;Q.xp+=10;bump('words');speak(w.en)}
  else{st.bad++;Q.miss++;if(q.type==='type')q.type='en2pt';Q.queue.push(q);const c=$('#app');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  save();
  const sheet=document.createElement('div');
  sheet.className='sheet '+(ok?'ok':'bad');
  sheet.innerHTML=`<div><h3>${ok?'✅ Certo':'❌ Errado'}</h3><p>${esc(pick(ok?m.ok:m.bad))}${ok?'':`<br><b>Resposta: ${esc(correct)}</b> <span class="pron">(${esc(w.pron)}) = ${esc(w.pt)}</span>`}</p><button class="btn ${ok?'ok':'bad'}" id="cont">Continuar</button></div>`;
  document.body.appendChild(sheet);
  $('#cont').focus();
  const cont=()=>{sheet.remove();document.removeEventListener('keydown',onk);nextQ()};
  const onk=e=>{if(e.key==='Enter'){e.preventDefault();cont()}};
  $('#cont').onclick=cont;setTimeout(()=>document.addEventListener('keydown',onk),50);
}
function finishQuiz(){
  view='result';
  const pct=Math.round(Q.hits/(Q.hits+Q.miss)*100),m=M(),u=Q.u,opt=Q.opt;
  award(Q.xp);
  if(u.items){S.units[u.id]=Math.max(S.units[u.id]||0,pct);save()}
  full(`<div class="res"><div class="big">${pct>=80?'🏆':pct>=60?'😐':'💩'}</div><h2>${pct}% de acerto</h2>
    <p class="mut" style="max-width:420px;margin:10px auto">“${esc(pick(pct<60?m.low:m.fin))}”</p>
    <div class="stats"><span class="chip">⭐ +${Q.xp} XP</span><span class="chip">✅ ${Q.hits}</span><span class="chip">❌ ${Q.miss}</span></div>
    ${opt.next?`<button class="btn" id="nx">Continuar a lição</button>`:`<div class="row" style="margin-top:20px"><button class="btn sec2" id="h">Início</button><button class="btn" id="again">Mais uma vez</button></div>`}</div>`);
  if(opt.next)$('#nx').onclick=opt.next;
  else{$('#h').onclick=hoje;$('#again').onclick=()=>startQuiz(u)}
}

/* jogo: liga as palavras */
function game(){
  view='game';
  const pool=shuffle(allWords()).slice(0,6);
  const L=shuffle(pool),R=shuffle(pool);
  let sel=null,left=6,t=40,miss=0;
  full(`<div class="q-top"><button class="x" id="x">✕</button><div class="bar"><i id="tb" style="width:100%"></i></div><span class="chip" id="tt">40</span></div>
    <div class="prompt">Toque em uma palavra em inglês e depois na tradução</div>
    <div class="pair"><div class="col" id="cl">${L.map(w=>`<button data-k="${esc(w.en)}">${esc(w.en)}</button>`).join('')}</div><div class="col" id="cr">${R.map(w=>`<button data-k="${esc(w.en)}">${esc(w.pt)}</button>`).join('')}</div></div>`);
  const timer=setInterval(()=>{t--;$('#tt')&&($('#tt').textContent=t,$('#tb').style.width=t/40*100+'%');if(t<=0)end()},1000);
  const end=()=>{
    clearInterval(timer);
    const ok=6-left,xp=ok*5+(left===0?t:0);
    award(xp);bump('words',ok);
    full(`<div class="res"><div class="big">${left===0?'🏆':'⏱️'}</div><h2>${ok}/6 pares</h2><p class="mut">${left===0?'Fechou antes do tempo!':'Acabou o tempo.'}</p>
      <div class="stats"><span class="chip">⭐ +${xp} XP</span></div>
      <div class="row"><button class="btn sec2" id="h">Início</button><button class="btn" id="again">Jogar de novo</button></div></div>`);
    $('#h').onclick=hoje;$('#again').onclick=game;
  };
  $('#x').onclick=()=>{clearInterval(timer);hoje()};
  const click=(side)=>e=>{
    const b=e.target.closest('button');if(!b||b.classList.contains('gone'))return;
    if(!sel||sel.side===side){app.querySelectorAll('.pair .sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel={side,k:b.dataset.k,b};return}
    if(sel.k===b.dataset.k){
      sel.b.classList.remove('sel');sel.b.classList.add('gone');b.classList.add('gone');sel=null;left--;
      const w=pool.find(x=>x.en===b.dataset.k);speak(w.en);
      if(left===0)setTimeout(end,500);
    }else{miss++;sel.b.classList.remove('sel');sel=null;const c=$('#app');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  };
  $('#cl').onclick=click('l');$('#cr').onclick=click('r');
}

/* ============================================================
   SITUAÇÕES + CONVERSA ROTEIRIZADA
   ============================================================ */
function situ(){
  shell(`<div class="top"><h2>Situações</h2></div><p class="mut" style="margin-top:0">A professora faz o papel de quem te atende. Você responde falando ou digitando, e ela corrige na hora.</p>
  ${SITS.map(s=>`<div class="sec">${s.ic} ${s.th}</div><div class="list">${s.list.map(d=>{const p=S.dlg[d.id]||0;return `<button class="unit ${p>=80?'done':''}" data-d="${d.id}"><div class="em">${s.ic}</div><div style="flex:1"><h3>${esc(d.t)}</h3><small>${d.turns.length} falas${p?` · melhor ${p}%`:''}</small><div class="bar"><i style="width:${p}%"></i></div></div></button>`}).join('')}</div>`).join('')}`,'situ');
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>startDialog(SITS.flatMap(s=>s.list).find(d=>d.id===b.dataset.d)));
}
let D=null;
function tBubble(t,pt){
  return `<div class="b t"><div>${esc(t)} <button class="sp" data-say="${esc(t)}">🔊</button></div>${pt?`<div class="tr ${S.pt==='en'?'hid':''}">${esc(pt)}</div>`:''}</div>`;
}
function startDialog(d,opt={}){
  D={d,i:0,tries:0,scores:[],log:[],opt,phase:'ask'};
  D.log.push(`<div class="b f"><b>${esc(d.t)}</b>. Responda em inglês. Toque no microfone ou digite.</div>`);
  dlgTurn();
}
function dlgTurn(){
  const t=D.d.turns[D.i];
  D.tries=0;D.phase='ask';
  D.log.push(tBubble(t.en,t.pt));
  dlgDraw();speak(t.en);
}
function dlgDraw(){
  const d=D.d,t=d.turns[D.i];view='dlg';
  full(`<div class="q-top"><button class="x" id="x">✕</button><div class="bar"><i style="width:${D.i/d.turns.length*100}%"></i></div></div>
   <div class="chatlog" id="cl">${D.log.join('')}</div>
   <div class="dock">${D.phase==='ask'?`
     <div class="cue">🎯 ${esc(t.cue)}</div>
     <button class="mic" id="mic">🎙️ Falar</button>
     <div class="send"><input class="tx" id="tx" placeholder="ou digite aqui…" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="sd">Enviar</button></div>
     <div class="row"><button class="btn sec2 sm" id="hint">💡 Dica</button><button class="btn sec2 sm" id="skip">Pular</button></div>`
     :`<button class="btn" id="nx">${D.i===d.turns.length-1?'Ver resultado':'Continuar'}</button>`}</div>`);
  const cl=$('#cl');if(cl&&cl.lastElementChild)cl.lastElementChild.scrollIntoView({block:'end'});
  $('#x').onclick=()=>{if(confirm('Sair da conversa?')){stopListen();D=null;go('situ')}};
  if(D.phase==='ask'){
    bindMic($('#mic'),alts=>dlgAnswer(alts));
    const send=()=>{const v=$('#tx').value.trim();if(v)dlgAnswer([v])};
    $('#sd').onclick=send;$('#tx').onkeydown=e=>{if(e.key==='Enter')send()};
    $('#hint').onclick=()=>{D.log.push(`<div class="b f">💡 Dica: <b>${esc(t.a[0])}</b> <button class="sp" data-say="${esc(t.a[0])}">🔊</button></div>`);dlgDraw()};
    $('#skip').onclick=()=>{D.scores.push(0);D.log.push(`<div class="b f">Resposta: <b>${esc(t.a[0])}</b></div>`);D.phase='fb';dlgDraw()};
  }else{
    $('#nx').onclick=()=>{D.i++;if(D.i>=D.d.turns.length)dlgFinish();else dlgTurn()};
  }
}
function dlgAnswer(alts){
  const t=D.d.turns[D.i],r=evalAns(alts,t.a),g=grade(r.score),m=M();
  bump('speaks');
  D.log.push(`<div class="b u">${wordsHtml(r)}<div class="tr">${Math.round(r.score*100)}%</div></div>`);
  let fb=esc(pick(m[g]));
  if(g!=='ok')fb+=`<div class="cor">Forma certa: <b>${esc(r.target)}</b> <button class="sp" data-say="${esc(r.target)}">🔊</button></div>`;
  D.log.push(`<div class="b t">${fb}</div>`);
  D.tries++;
  if(g==='ok'||D.tries>=2){D.scores.push(r.score);D.phase='fb';if(g==='ok')award(10);else if(g==='almost')award(5)}
  dlgDraw();
  if(g==='ok')speak(r.target);
}
function dlgFinish(){
  const sc=D.scores,avg=sc.reduce((a,b)=>a+b,0)/sc.length,pct=Math.round(avg*100),d=D.d,opt=D.opt,m=M();
  S.dlg[d.id]=Math.max(S.dlg[d.id]||0,pct);bump('convos');award(10);
  full(`<div class="res"><div class="big">${pct>=80?'🏆':pct>=60?'😐':'💩'}</div><h2>${pct}% na conversa</h2>
    <p class="mut" style="max-width:420px;margin:10px auto">“${esc(pick(pct<60?m.low:m.fin))}”</p>
    <div class="stats"><span class="chip">⭐ +10 XP</span><span class="chip">${esc(d.t)}</span></div>
    ${opt.next?`<button class="btn" id="nx">Continuar</button>`:`<div class="row" style="margin-top:20px"><button class="btn sec2" id="h">Situações</button><button class="btn" id="again">Repetir</button></div>`}</div>`);
  if(opt.next)$('#nx').onclick=opt.next;
  else{$('#h').onclick=()=>go('situ');$('#again').onclick=()=>startDialog(d)}
}

/* ============================================================
   TREINO DE PRONÚNCIA
   ============================================================ */
function phrasePool(){
  const p=[];
  SITS.forEach(s=>s.list.forEach(d=>d.turns.forEach(t=>p.push({en:t.a[0],pt:t.cue.replace(/^[^“]*“|”.*$/g,'')}))));
  UNITS.find(u=>u.id==='frases').items.forEach(i=>p.push({en:i[0].replace('...',''),pt:i[1]}));
  return p;
}
let P=null;
function pronDrill(opt={}){
  P={list:shuffle(phrasePool()).slice(0,opt.n||5),i:0,scores:[],opt,res:null,typing:!SR};
  pronDraw();
}
function pronDraw(){
  view='pron';
  const p=P.list[P.i],mk=moodKey();
  let body;
  if(P.res){
    const g=grade(P.res.score);
    body=`<div class="stage">${mascot(g==='ok'?'calma':mk,110)}</div>
      <div class="fbk"><div>${wordsHtml(P.res)}</div><div class="mut" style="margin-top:4px">${Math.round(P.res.score*100)}%</div><div style="margin-top:6px">${esc(pick(M()[g]))}</div></div>
      <div class="row"><button class="btn sec2" id="rt">Repetir</button><button class="btn" id="nx">${P.i===P.list.length-1?'Terminar':'Próxima'}</button></div>`;
  }else{
    body=`<div class="stage">${mascot(mk,110)}</div>
      ${P.typing?`<div class="send"><input class="tx" id="tx" placeholder="digite a frase em inglês…" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="sd">Enviar</button></div>`
      :`<div class="micr"><button class="micb" id="mic" data-keep="1" aria-label="Falar">🎙️</button><small id="ml"><b>toque para falar</b><br>um toque para começar, outro quando terminar</small></div>`}
      ${SR?`<div style="text-align:center"><button class="lnk" id="tg">${P.typing?'falar em voz alta':'digitar em vez de falar'}</button></div>`:'<p class="mut" style="text-align:center;font-size:13px">Seu navegador não ouve voz. Use o Chrome ou o Edge, ou digite.</p>'}`;
  }
  full(`<div class="ob" style="padding-bottom:24px"><div class="obt"><button class="x" id="x">✕</button><div class="bar"><i style="width:${P.i/P.list.length*100}%"></i></div>${ctl()}</div>
    <div class="pcard"><div class="lab">repita comigo · ${P.i+1}/${P.list.length}</div><h2>${esc(p.en)}<button class="sp" id="sp" aria-label="Ouvir">🔊</button><button class="sp" id="sl" aria-label="Ouvir devagar">🐢</button></h2><div class="mut" style="margin-top:4px">${esc(p.pt)}</div></div>${body}</div>`);
  bindCtl();
  $('#x').onclick=()=>{stopListen();go('hoje')};
  $('#sp').onclick=()=>speak(p.en,0,1);$('#sl').onclick=()=>speak(p.en,.55,1);
  const done=alts=>{P.res=evalAns(alts,[p.en]);const sc=P.res.score;bump('speaks');award(Math.round(sc*10));P.scores.push(sc);pronDraw()};
  if(P.res){
    $('#rt').onclick=()=>{P.scores.pop();P.res=null;pronDraw()};
    $('#nx').onclick=()=>{P.i++;P.res=null;if(P.i>=P.list.length)pronEnd();else pronDraw()};
  }else{
    if(P.typing){
      const send=()=>{const v=$('#tx').value.trim();if(v)done([v])};
      $('#sd').onclick=send;$('#tx').onkeydown=e=>{if(e.key==='Enter')send()};
    }else bindMic($('#mic'),done);
    const tg=$('#tg');if(tg)tg.onclick=()=>{stopListen();P.typing=!P.typing;pronDraw()};
    speak(p.en);
  }
}
function pronEnd(){
  const avg=P.scores.reduce((a,b)=>a+b,0)/P.scores.length,pct=Math.round(avg*100),opt=P.opt,m=M();
  full(`<div class="res"><div class="big">${pct>=80?'🏆':pct>=60?'😐':'💩'}</div><h2>Pronúncia: ${pct}%</h2>
    <p class="mut" style="max-width:420px;margin:10px auto">“${esc(pick(pct<60?m.low:m.fin))}”</p>
    ${opt.next?`<button class="btn" id="nx">Continuar a lição</button>`:`<div class="row"><button class="btn sec2" id="h">Início</button><button class="btn" id="again">Mais uma</button></div>`}</div>`);
  if(opt.next)$('#nx').onclick=opt.next;else{$('#h').onclick=hoje;$('#again').onclick=()=>pronDrill({n:5})}
}

/* ============================================================
   CONVERSA LIVRE (usa o servidor com IA, se configurado)
   ============================================================ */
const TOPICS=['Qualquer assunto','Viagem','Comida','Trabalho','Família','Filmes e música','Rotina'];
let C=null;
function conversar(){
  const has=!!S.api.url;
  shell(`<div class="top"><h2>Conversar</h2></div>
  ${has?`<div class="hero"><h2>💬 Conversa livre</h2><p>Escolha um assunto e fale com a ${M().ic} professora de verdade. Ela responde em voz e corrige o que você errou.</p></div>
    <div class="sec">Assunto</div><div class="chipset" id="tp">${TOPICS.map((t,i)=>`<button data-t="${i}" class="${i===0?'on':''}">${t}</button>`).join('')}</div>
    <button class="btn" id="go">Começar a conversa</button>`
  :`<div class="hero"><h2>💬 Conversa livre com IA</h2><p>Aqui você fala de qualquer assunto e a professora responde na hora. Isso precisa de um servidor próprio com uma chave de IA, que você liga uma vez só.</p></div>
    <div class="card2"><b>Como ligar</b><ol><li>Siga o passo a passo do arquivo <b>servidor/LEIA-ME.md</b>.</li><li>Cole o endereço do servidor em <b>Perfil → Conversa livre</b>.</li></ol></div>
    <button class="btn sec2" id="pf" style="margin-bottom:10px">Ir para Perfil</button>
    <button class="btn" id="st">Enquanto isso, praticar situações</button>`}`,'conversar');
  if(has){
    let topic=0;
    app.querySelectorAll('#tp button').forEach(b=>b.onclick=()=>{topic=+b.dataset.t;app.querySelectorAll('#tp button').forEach(x=>x.classList.toggle('on',x===b))});
    $('#go').onclick=()=>chat(topic?TOPICS[topic]:'');
  }else{$('#pf').onclick=()=>go('perfil');$('#st').onclick=()=>go('situ')}
}
function chat(topic){
  C={msgs:[],log:[],busy:false,topic};
  view='chat';
  full(`<div class="q-top"><button class="x" id="x">✕</button><b>${M().ic} ${esc(M().nome)}${topic?' · '+esc(topic):''}</b></div>
   <div class="chatlog" id="cl"></div>
   <div class="dock"><button class="mic" id="mic">🎙️ Falar</button>
   <div class="send"><input class="tx" id="tx" placeholder="ou digite em inglês…" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="sd">Enviar</button></div></div>`);
  $('#x').onclick=()=>{stopListen();go('conversar')};
  const send=t=>{t=(t||'').trim();if(!t||C.busy)return;$('#tx').value='';askAI(t)};
  bindMic($('#mic'),alts=>send(alts[0]));
  $('#sd').onclick=()=>send($('#tx').value);
  $('#tx').onkeydown=e=>{if(e.key==='Enter')send($('#tx').value)};
  askAI();
}
function chatDraw(){
  const cl=$('#cl');if(!cl)return;
  cl.innerHTML=C.log.map(x=>{
    if(x.r==='u')return `<div class="b u">${esc(x.t)}</div>`;
    if(x.r==='e')return `<div class="b err">${esc(x.t)}</div>`;
    return `<div class="b t"><div>${esc(x.t)} <button class="sp" data-say="${esc(x.t)}">🔊</button></div>${x.tr?`<div class="tr ${S.pt==='en'?'hid':''}">${esc(x.tr)}</div>`:''}${x.c?`<div class="cor">✏️ ${esc(x.c)}</div>`:''}</div>`;
  }).join('')+(C.busy?'<div class="b t mut">digitando…</div>':'');
  if(cl.lastElementChild)cl.lastElementChild.scrollIntoView({block:'end'});
}
async function askAI(text){
  if(text){C.msgs.push({role:'user',content:text});C.log.push({r:'u',t:text})}
  C.busy=true;chatDraw();
  try{
    const r=await fetch(S.api.url,{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':S.api.token||''},
      body:JSON.stringify({messages:C.msgs.slice(-12),mood:moodKey(),adult:!!S.adult,level:S.level||'A0',pt:S.pt,name:S.name,topic:C.topic})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||('erro '+r.status));
    C.msgs.push({role:'assistant',content:j.reply});
    C.log.push({r:'a',t:j.reply,tr:j.translation,c:j.correction});
    if(text){award(3);bump('speaks')}
    speak(j.reply);
  }catch(e){C.log.push({r:'e',t:'Não consegui falar com o servidor ('+e.message+'). Confira o endereço e a senha em Perfil.'})}
  C.busy=false;chatDraw();
}

/* ============================================================
   PERFIL
   ============================================================ */
function perfil(){
  shell(`<div class="top"><h2>Perfil</h2></div>
  <div class="chips" style="margin-bottom:12px"><span class="chip">⭐ ${S.xp} XP</span><span class="chip">Nv ${lvl()}</span><span class="chip">🔥 ${streakNow()} dias</span><span class="chip">Nível ${S.level||'?'}</span></div>
  <div class="set"><label><span>Seu nome</span><input class="tx" id="nm" style="max-width:200px;padding:8px 10px;font-size:16px" value="${esc(S.name)}" maxlength="20"></label></div>
  <div class="sec">Jeito da professora</div>${moodPicker()}
  <div class="set">
    <label><span>Português na explicação<small>Mostra traduções abertas ou escondidas</small></span><span class="seg" id="sp1"><button data-v="pt" class="${S.pt==='pt'?'on':''}">Com</button><button data-v="en" class="${S.pt==='en'?'on':''}">Menos</button></span></label>
    <label><span>Voz da professora</span><span class="seg" id="sp2"><button data-v="1" class="${S.voice?'on':''}">Ligada</button><button data-v="0" class="${!S.voice?'on':''}">Muda</button></span></label>
    <label><span>Tema</span><span class="seg" id="sp3"><button data-v="light" class="${S.theme!=='dark'?'on':''}">Claro</button><button data-v="dark" class="${S.theme==='dark'?'on':''}">Escuro</button></span></label>
    <label><span>Refazer a configuração<small>Nível, metas e jeito da professora</small></span><button class="btn sm sec2" id="rt">Refazer</button></label>
  </div>
  <div class="sec">Conversa livre (servidor com IA)</div>
  <div class="set">
    <p class="mut" style="margin:0 0 8px;font-size:14px">Cole aqui o endereço do seu servidor e a senha que você definiu nele. Isso fica guardado só neste aparelho.</p>
    <input class="tx" id="au" placeholder="https://seu-servidor.workers.dev" value="${esc(S.api.url)}" style="margin-bottom:8px;font-size:15px" autocapitalize="none" spellcheck="false">
    <input class="tx" id="at" type="password" placeholder="Senha do servidor" value="${esc(S.api.token)}" style="margin-bottom:8px;font-size:15px">
    <div class="row"><button class="btn sec2 sm" id="sv">Salvar</button><button class="btn sec2 sm" id="ts">Testar conexão</button></div>
  </div>
  <button class="btn bad" id="reset" style="margin-top:8px">Apagar todo o progresso</button>`,'perfil');
  bindMoodPicker(()=>perfil());
  $('#nm').onchange=e=>{S.name=e.target.value.trim();save()};
  $('#sp1').onclick=e=>{const v=e.target.dataset.v;if(!v)return;S.pt=v;save();perfil()};
  $('#sp2').onclick=e=>{const v=e.target.dataset.v;if(v===undefined)return;S.voice=v==='1';save();perfil()};
  $('#rt').onclick=()=>onboarding(0);
  $('#sp3').onclick=e=>{const v=e.target.dataset.v;if(!v)return;S.theme=v;save();applyTheme();perfil()};
  const saveApi=()=>{S.api={url:$('#au').value.trim(),token:$('#at').value};save()};
  $('#sv').onclick=()=>{saveApi();toast('Salvo')};
  $('#ts').onclick=async()=>{
    saveApi();if(!S.api.url)return toast('Cole o endereço primeiro.');
    toast('Testando…');
    try{
      const r=await fetch(S.api.url,{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':S.api.token||''},body:JSON.stringify({messages:[],mood:'calma',adult:false,level:'A0',pt:'pt',name:'',topic:''})});
      const j=await r.json().catch(()=>({}));
      toast(r.ok?'Conexão OK ✅':'Falhou: '+(j.error||r.status));
    }catch(e){toast('Falhou: '+e.message)}
  };
  $('#reset').onclick=()=>{if(confirm('Apagar tudo mesmo? Vai recomeçar do zero.')){localStorage.removeItem(KEY);load();hoje()}};
}

/* ============================================================
   INÍCIO
   ============================================================ */
load();applyTheme();hoje();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
